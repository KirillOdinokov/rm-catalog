server {
    include /etc/nginx/snippets/static-canonical.conf;
    if ($http_user_agent ~* (ClaudeBot|Claude-SearchBot|Claude-Web|anthropic-ai|SemrushBot|AhrefsBot|MJ12bot|DotBot|Barkrowler|PetalBot|Bytespider|GPTBot|CCBot|OAI-SearchBot|ExaSearchBot|Amazonbot|KakaoBot|TLM-Audit-Scanner|l9scan|LeakIX|PerplexityBot|ElevenlabsCrawler|Yokohama|GeedoShopProductFinder|domain-list-check|SEOJuice|rawgrab)) { return 403; }

    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rex.moscow www.rex.moscow;

    ssl_certificate /etc/letsencrypt/live/rex.moscow/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rex.moscow/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sites/rex.moscow;
    index index.html;
    charset utf-8;
    client_max_body_size 16m;
    autoindex off;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # legacy WooCommerce paths -> flat pages
    rewrite ^/product/([^/]+)/?$ /$1 permanent;
    rewrite ^/category/([^/]+)/?$ /$1 permanent;
    rewrite ^/calculators/?$ /kalkulyatory permanent;
    rewrite ^/(cart-2|checkout-2|wishlist|my-account)/?$ / permanent;
    rewrite ^/shop/page/[0-9]+/?$ /shop permanent;
    rewrite ^/iznosostoykost-po-taberu/.*$ /shop permanent;
    rewrite ^/(shilka-1|shilka-2b)/?$ /shop permanent;
    # дубль позиции прайса: та же карточка, что /hacut-ochistitel
    rewrite ^/hacut-ochistitel-2/?$ /hacut-ochistitel permanent;

    # trailing slash on flat pages -> canonical without slash
    rewrite ^/([^/.]+)/$ /$1 permanent;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sites/rex.moscow;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~ \.php$ { return 404; }

    location / {
        expires -1;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico|pdf|json)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }
}
