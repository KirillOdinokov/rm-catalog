server {
    include /etc/nginx/snippets/static-canonical.conf;
    if ($http_user_agent ~* (ClaudeBot|Claude-SearchBot|Claude-Web|anthropic-ai|SemrushBot|AhrefsBot|MJ12bot|DotBot|Barkrowler|PetalBot|Bytespider|GPTBot|CCBot|OAI-SearchBot|ExaSearchBot|Amazonbot|KakaoBot|TLM-Audit-Scanner|l9scan|LeakIX|PerplexityBot|ElevenlabsCrawler|Yokohama|GeedoShopProductFinder|domain-list-check|SEOJuice|rawgrab)) { return 403; }

    listen 80;
    listen [::]:80;
    server_name rex.moscow www.rex.moscow;

    root /var/www/sites/rex.moscow;
    index index.html;
    charset utf-8;
    client_max_body_size 16m;
    autoindex off;

    # ACME challenge always over plain HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sites/rex.moscow;
        allow all;
    }

    location / {
        return 301 https://rex.moscow$request_uri;
    }
}
