server {
    listen 80;
    listen [::]:80;
    server_name rex.moscow www.rex.moscow;

    # ACME-проверка остаётся на HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rex.moscow/public;
        allow all;
    }

    location / {
        return 301 https://rex.moscow$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rex.moscow;

    ssl_certificate     /etc/letsencrypt/live/rex.moscow/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rex.moscow/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/rex.moscow/public;
    index index.html;
    charset utf-8;
    autoindex off;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # legacy WooCommerce адреса -> плоские страницы
    rewrite ^/product/([^/]+)/?$ /$1 permanent;
    rewrite ^/category/([^/]+)/?$ /$1 permanent;
    rewrite ^/calculators/?$ /kalkulyatory permanent;
    rewrite ^/(cart-2|checkout-2|wishlist|my-account)/?$ / permanent;
    rewrite ^/shop/page/[0-9]+/?$ /shop permanent;
    rewrite ^/iznosostoykost-po-taberu/.*$ /shop permanent;
    rewrite ^/(shilka-1|shilka-2b)/?$ /shop permanent;

    # слэш на плоских страницах -> канонический адрес без слэша
    rewrite ^/([^/.]+)/$ /$1 permanent;

    location ~ /\.(?!well-known) { deny all; }
    location ~ \.php$ { return 404; }

    location / {
        expires -1;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico|pdf|json)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.rex.moscow;

    ssl_certificate     /etc/letsencrypt/live/rex.moscow/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rex.moscow/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://rex.moscow$request_uri;
}
